name: CI & Deploy to GitHub Pages
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build            # runs prebuild content validation first
      - name: Lighthouse CI budgets
        run: npx --yes @lhci/cli@0.14.x autorun || echo "::warning::Lighthouse budgets not met"
      - name: e2e (Chromium; non-blocking until headless audio is stable in CI)
        run: npx playwright install --with-deps chromium && npx playwright test --project=chromium || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
