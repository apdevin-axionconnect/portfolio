<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Portfolio</title>
    <meta name="description" content="A developer portfolio you can walk into: a 3D room with a working macOS-style desktop on the monitor." />
    <meta name="theme-color" content="#05060a" />
    <!-- start the room download in parallel with the JS instead of after it has parsed -->
    <link rel="preload" href="room.glb" as="fetch" crossorigin />
  </head>
  <body>
    <!-- Static loader: painted before any JavaScript runs. App.jsx adds .done once the shaders are compiled.
         The spinner animates transform only, so it keeps moving even if the main thread is busy. -->
    <div id="loader" role="status" aria-live="polite">
      <div class="spin"></div>
      <p>Setting up the room…</p>
    </div>
    <style>
      #loader { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 18px; background: #05060a; color: #aab2c5; font: 14px system-ui, sans-serif; transition: opacity .5s; }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #8fa3ff; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loader .spin { animation-duration: 3s; } }
    </style>
    <div id="root"></div>
    <noscript>This portfolio is an interactive 3D scene and needs JavaScript. The plain version is at <a href="os/index.html">os/index.html</a>.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
